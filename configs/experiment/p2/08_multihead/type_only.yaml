# @package _global_
# Single Type head control (upper bound for the Type task), pretrained backbone,
# drop_sample for blank Type rows.
defaults:
  - /runtime: default
  - /storage: local_only
  - /data: ichthyoliths_denticle_type
  - /optimizer: adamw
  - /training_outputs: p1_local
  - _self_

experiment:
  name: p2_multihead_type_only

task:
  type: supervised

runtime:
  num_workers: 8
  progress_bar: true

model:
  image_input:
    name: image
    backbone:
      architecture:
        source: timm
        name: efficientnet_b1
        output_dim: auto
        input_channels: 3
      weights:
        source: library
  tabular_input:
    enabled: false
    name: tabular
  embedding_adapter:
    enabled: true
    type: linear
    output_dim: 512
  heads:
    Type:
      type: multiclass_classification
      target: Type
      num_classes: 48
      network:
        type: linear

objectives:
  Type:
    head: Type
    loss: cross_entropy
    metrics:
      - f1_macro
      - f1_micro
      - accuracy
    weight: 1.0

transforms:
  image_mode: rgb
  input_bit_depth: 8
  pipeline:
    - name: resize
      size: [240, 240]
    - name: horizontal_flip
      p: 0.5
      train_only: true
    - name: vertical_flip
      p: 0.5
      train_only: true
    - name: normalize
      mode: fixed
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

training:
  max_epochs: 100
  batch_size: 16
  sampler:
    type: default
  freeze:
    backbone:
      policy: none
  early_stopping:
    enabled: true
    monitor: val/loss
    mode: min
    patience: 10

checkpointing:
  monitor: val/Type/f1_macro
  mode: max
  save_top_k: 1
  save_last: true

output_root: ./runs

training_outputs:
  dir_template: "{experiment.name}/{timestamp}_{runtime.run_id}"
  figures:
    enabled: true
