# @package _global_
# Multi-head ichthyolith morphology: 46 A1-O10 heads, mask_objective so blank
# cells mask the per-head loss. timm EfficientNet-B1 (ImageNet-pretrained),
# 240x240, ImageNet normalization. Uses the coverage-optimized `split`.

defaults:
  - /runtime: default
  - /storage: local_only
  - /data: ichthyoliths_denticle_multihead
  - /optimizer: adamw
  - /training_outputs: p1_local
  - _self_

experiment:
  name: p2_multihead_base

task:
  type: supervised

runtime:
  num_workers: 8
  progress_bar: true
  preflight:
    enabled: true
    checks:
      empty_train_classes: warn
      empty_eval_classes: warn
      missing_required_targets: warn
      no_remaining_valid_target_labels: warn
      non_contiguous_class_indices: warn
      imbalance_ratio_gt:
        severity: warn
        threshold: 20.0

model:
  image_input:
    name: image
    backbone:
      architecture:
        source: timm
        name: efficientnet_b1
        output_dim: auto
        input_channels: 3
      weights:
        source: library
  tabular_input:
    enabled: false
    name: tabular
  embedding_adapter:
    enabled: true
    type: linear
    output_dim: 512
  heads:
    A1:
      type: multiclass_classification
      target: A1
      num_classes: 10
      network:
        type: linear
    A2:
      type: multiclass_classification
      target: A2
