transforms:
  image_mode: rgb
  input_bit_depth: 8
  pipeline:
    - name: resize
      size: [240, 240]
    - name: horizontal_flip
      p: 0.5
      train_only: true
    - name: vertical_flip
      p: 0.5
      train_only: true
    - name: normalize
      mode: fixed
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

training:
  max_epochs: 30
  batch_size: 16
  sampler:
    type: default
  freeze:
    backbone:
      policy: none

checkpointing:
  monitor: val/loss
  mode: min
  save_top_k: 1
  save_last: true

output_root: ./runs

training_outputs:
  dir_template: "{experiment.name}/{timestamp}_{runtime.run_id}"
  figures:
    enabled: true
