# @package _global_
# NES 155-species baseline: torchvision EfficientNet-B0 (ImageNet-pretrained),
# 224x224, H+V flip, ImageNet normalization, linear adapter, plain CE.
# All other p2 NES experiments inherit this via the defaults list. Dataset-derived
# normalization is examined only in 03_pretraining-and-normalization.

defaults:
  - /runtime: default
  - /storage: local_only
  - /data: nes-hf
  - /backbone/torchvision@model.image_input.backbone: efficientnet_b0
  - /optimizer: adamw
  - /training_outputs: p1_local
  - _self_

experiment:
  name: p2_nes_baseline

task:
  type: supervised

runtime:
  num_workers: 8
  progress_bar: true

model:
  image_input:
    name: image
  tabular_input:
    enabled: false
    name: tabular
  embedding_adapter:
    enabled: true
    type: linear
    output_dim: 512
  heads:
    species:
      type: multiclass_classification
      target: species
      num_classes: 155
      network:
        type: linear

objectives:
  species:
    head: species
    loss: cross_entropy
    metrics:
      - f1_macro
      - f1_micro
      - accuracy
    weight: 1.0

transforms:
  image_mode: rgb
  input_bit_depth: 8
  pipeline:
    - name: resize
      size: [224, 224]
    - name: horizontal_flip
      p: 0.5
      train_only: true
    - name: vertical_flip
      p: 0.5
      train_only: true
    - name: normalize
      mode: fixed
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

training:
  max_epochs: 100
  batch_size: 64
  sampler:
    type: default
  freeze:
    backbone:
      policy: none
  early_stopping:
    enabled: true
    monitor: val/loss
    mode: min
    patience: 10

checkpointing:
  monitor: val/species/f1_macro
  mode: max
  save_top_k: 1
  save_last: true

output_root: ./runs

training_outputs:
  dir_template: "{experiment.name}/{timestamp}_{runtime.run_id}"
  figures:
    enabled: true
