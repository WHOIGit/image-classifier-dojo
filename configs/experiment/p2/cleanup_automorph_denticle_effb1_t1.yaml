# @package _global_

defaults:
  - /runtime: default
  - /storage: local_only
  - /data: cleanup_automorph_denticle_rois_t1
  - /optimizer: adamw
  - /training_outputs: p1_local
  - _self_

experiment:
  name: cleanup_automorph_denticle_effb1_t1

task:
  type: supervised

runtime:
  num_workers: 8
  progress_bar: true
  preflight:
    enabled: true
    checks:
      empty_train_classes: warn
      empty_eval_classes: warn
      missing_required_targets: warn
      no_remaining_valid_target_labels: warn
      non_contiguous_class_indices: warn
      imbalance_ratio_gt:
        severity: warn
        threshold: 20.0

model:
  image_input:
    name: image
    backbone:
      architecture:
        source: timm
        name: efficientnet_b1
        output_dim: auto
        input_channels: 3
      weights:
        source: library
  tabular_input:
    enabled: false
    name: tabular
  embedding_adapter:
    enabled: true
    type: linear
    output_dim: 512
  heads:
    T1:
      type: multiclass_classification
      target: T1
      num_classes: 48
      network:
        type: linear

objectives:
  T1:
    head: T1
    loss: cross_entropy
    metrics:
      - f1_macro
      - f1_micro
    weight: 1.0

transforms:
  image_mode: rgb
  input_bit_depth: 8
  pipeline:
    - name: resize
      size: [240, 240]
    - name: horizontal_flip
      p: 0.5
      train_only: true
    - name: vertical_flip
      p: 0.5
      train_only: true
    - name: normalize
      mode: fixed
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

training:
  max_epochs: 10
  batch_size: 16
  sampler:
    type: default
  freeze:
    backbone:
      policy: none

checkpointing:
  monitor: val/T1/f1_macro
  mode: max
  save_top_k: 1
  save_last: true

output_root: ./runs

training_outputs:
  dir_template: "{experiment.name}/{timestamp}_{runtime.run_id}"
  figures:
    enabled: true
