# @package _global_
# Cross-domain transfer of a NES-trained backbone onto the ichthyolith denticle
# Type head (plankton -> microfossil ROI domain shift). Type only, drop_sample
# for blanks. ImageNet normalization. Set backbone.weights.uri before running.

defaults:
  - /runtime: default
  - /storage: local_only
  - /data: ichthyoliths_denticle_type
  - /backbone/torchvision@model.image_input.backbone: efficientnet_b0
  - /optimizer: adamw
  - /training_outputs: p1_local
  - _self_

experiment:
  name: p2_transfer_type_base

task:
  type: supervised

runtime:
  num_workers: 8
  progress_bar: true

model:
  image_input:
    name: image
    backbone:
      weights:
        source: checkpoint
        uri: ./runs/REPLACE_WITH_NES_RUN/checkpoints/last.ckpt
        strict: false
  tabular_input:
    enabled: false
    name: tabular
  embedding_adapter:
    enabled: true
    type: linear
    output_dim: 512
  heads:
    Type:
      type: multiclass_classification
      target: Type
      num_classes: 48
      network:
        type: linear

objectives:
  Type:
    head: Type
    loss: cross_entropy
    metrics:
      - f1_macro
      - f1_micro
      - accuracy
    weight: 1.0

transforms:
  image_mode: rgb
  input_bit_depth: 8
  pipeline:
    - name: resize
      size: [224, 224]
    - name: horizontal_flip
      p: 0.5
      train_only: true
    - name: vertical_flip
      p: 0.5
      train_only: true
    - name: normalize
      mode: fixed
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

training:
  max_epochs: 30
  batch_size: 16
  sampler:
    type: default
  freeze:
    backbone:
      policy: none

checkpointing:
  monitor: val/Type/f1_macro
  mode: max
  save_top_k: 1
  save_last: true

output_root: ./runs

training_outputs:
  dir_template: "{experiment.name}/{timestamp}_{runtime.run_id}"
  figures:
    enabled: true
