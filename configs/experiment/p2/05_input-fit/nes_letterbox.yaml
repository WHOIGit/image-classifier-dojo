# @package _global_
# Letterbox to a square canvas (preserve aspect via padding).
defaults:
  - /experiment/p2/00_baseline/nes_baseline
  - _self_

experiment:
  name: p2_input_letterbox

transforms:
  image_mode: rgb
  input_bit_depth: 8
  pipeline:
    - name: letterbox
      canvas_size: [224, 224]
    - name: horizontal_flip
      p: 0.5
      train_only: true
    - name: vertical_flip
      p: 0.5
      train_only: true
    - name: normalize
      mode: fixed
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]
