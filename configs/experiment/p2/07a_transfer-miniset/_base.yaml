# @package _global_
# Transfer a NES-trained Dojo backbone onto plankton-miniset (in-domain, 30
# classes). ImageNet normalization to match the pretrained/imagenet-norm baseline
# the checkpoint comes from. Set backbone.weights.uri to a concrete NES checkpoint.

defaults:
  - /runtime: default
  - /storage: local_only
  - /data: plankton-miniset
  - /backbone/torchvision@model.image_input.backbone: efficientnet_b0
  - /optimizer: adamw
  - /training_outputs: p1_local
  - _self_

experiment:
  name: p2_transfer_miniset_base

task:
  type: supervised

runtime:
  num_workers: 8
  progress_bar: true

model:
  image_input:
    name: image
    backbone:
      weights:
        source: checkpoint
        uri: "./runs/p2_nes_baseline/2026-07-21_17-47-48_venomous-panda/checkpoints/epoch=15-step=19392.ckpt"
        strict: false
  tabular_input:
    enabled: false
    name: tabular
  embedding_adapter:
    enabled: false
  heads:
    species:
      type: multiclass_classification
      target: species
      num_classes: 30
      network:
        type: linear

objectives:
  species:
    head: species
    loss: cross_entropy
    metrics:
      - f1_macro
      - f1_micro
      - accuracy
    weight: 1.0

transforms:
  image_mode: rgb
  input_bit_depth: 8
  pipeline:
    - name: resize
      size: [224, 224]
    - name: horizontal_flip
      p: 0.5
      train_only: true
    - name: vertical_flip
      p: 0.5
      train_only: true
    - name: normalize
      mode: fixed
      mean: [0.485, 0.456, 0.406]
      std: [0.229, 0.224, 0.225]

training:
  max_epochs: 100
  batch_size: 64
  sampler:
    type: default
  freeze:
    backbone:
      policy: none
  early_stopping:
    enabled: true
    monitor: val/loss
    mode: min
    patience: 10

checkpointing:
  monitor: val/species/f1_macro
  mode: max
  save_top_k: 1
  save_last: true

output_root: ./runs

training_outputs:
  dir_template: "{experiment.name}/{timestamp}_{runtime.run_id}"
  figures:
    enabled: true
