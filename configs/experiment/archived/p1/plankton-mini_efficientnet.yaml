# @package _global_

# Local example experiment (lives under ./configs, not shipped in the package).
# Trains on the committed `plankton-miniset` dev dataset (30 classes, ~842 samples)
# via the local `data=plankton-miniset` group. Demonstrates the config search-path
# fall-through: this file and the `plankton-miniset` data group are found first under
# ./configs, while every other group (runtime, backbone, optimizer, transforms,
# training_outputs) resolves from the installed package. Run from the repo root:
#   dojo train experiment=p1/plankton-mini_efficientnet
defaults:
  - /runtime: default
  - /storage: local_only
  - /data: plankton-miniset
  - /transforms: supervised_default
  - /backbone/torchvision@model.image_input.backbone: efficientnet_b0
  - /optimizer: adamw
  - /training_outputs: p1_local
  - _self_

experiment:
  name: plankton-mini_p1_efficientnet_b0

task:
  type: supervised

model:
  image_input:
    name: image
    backbone:
      weights:
        source: none  # network-free so the example runs offline on clone
  tabular_input:
    enabled: false
    name: tabular
  embedding_adapter:
    enabled: false
  heads:
    species:
      type: multiclass_classification
      target: species
      num_classes: 30
      network:
        type: linear

objectives:
  species:
    head: species
    loss: cross_entropy
    metrics:
      - accuracy
      - f1_macro
    weight: 1.0

training:
  max_epochs: 6
  batch_size: 64
  freeze:
    backbone:
      policy: none

checkpointing:
  monitor: val/species/f1_macro
  mode: max
  save_top_k: 1
  save_last: true

output_root: ./runs
