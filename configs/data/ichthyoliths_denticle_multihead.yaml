# Multi-head ichthyolith denticle morphology (A1-O10) plus the coarse Type
# label, from the locally annotated split CSV. `image_uri` holds absolute ROI
# paths. `split` is the coverage-optimized split; override data.split_column to
# `split-commons` for the commons-weighted variant. All heads use
# mask_objective so blank cells mask the per-head loss instead of dropping the
# whole row (the morphological columns are sparse). Type uses mask_objective
# too. Selectable as `data=ichthyoliths_denticle_multihead`. Run from repo root.
backend: csv_manifest
manifest_uri: ./datasets/ichthyoliths/local_annotated_denticle_rois_split.csv
split_column: split
sample_id_column: ffid
image_uri_column: image_uri
source_extra_columns:
  - roi_filename
  - roi_parent_dir
  - Age
  - Depth
  - stage
targets:
  A1:
    label_name_column: A1
    type: multiclass_classification
    missing_policy: mask_objective
  A2:
    label_name_column: A2
    type: multiclass_classification
    missing_policy: mask_objective
