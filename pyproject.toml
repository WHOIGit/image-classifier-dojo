[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "image_classifier_dojo"
version = "0.3.0.dev0"
description = "Image-Classifier-Dojo model training package"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sidney Batchelder", email = "sbatchelder@whoi.edu" }]

# --- Base dependencies ---
# Config validation, inspection, storage / result access, schema handling,
# and non-checkpoint artifact / metadata introspection — no Torch required.
# Lightning .ckpt inspection requires the train extra (see DESIGN-DOC/11-dependencies.md).
dependencies = [
  "pydantic",
  "pydantic-settings",
  "hydra-core",
  "omegaconf",
  "pyarrow",
  "datasets",
  "duckdb",
  "amplify-storage-utils @ git+https://github.com/WHOIGit/amplify-storage-utils.git",
  "amplify-db-utils @ git+https://github.com/WHOIGit/amplify-db-utils.git",
  "typer",
  "rich",
  "coolname",
  "humanize",
  "tqdm",
  "imagesize",
]

# --- Optional extras, gated by functional area ---
[project.optional-dependencies]
train = [
  "torch",
  "torchvision",
  "lightning",
  "torchmetrics[visual]",
  "numpy",
  "pandas",
  "pillow",
]
timm = ["timm"]
ssl = ["lightly"]
ifcb = ["ifcbkit @ git+https://github.com/WHOIGit/ifcbkit.git"]
repr_eval = [
  "umap-learn",
  "hdbscan",
  "scikit-learn",
]
s3 = ["boto3"]
onnx = [
  "onnx",
  "onnxruntime-gpu",
]
all = [
  "image_classifier_dojo[train,timm,ssl,ifcb,repr_eval,onnx,s3]",
]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "pre-commit",
]

[project.scripts]
dojo = "dojo.cli.main:main"

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Homepage = "https://github.com/WHOIGit/image_classifier_dojo"


[tool.hatch.build.targets.wheel]
packages = ["src/dojo"]

# Keep sdist lean. Packaged config groups ship inside the package (src/dojo);
# the project-root ./configs is a dev/consumer override layer, not library data.
[tool.hatch.build.targets.sdist]
include = [
  "pyproject.toml",
  "README.md",
  "src/dojo",
]

[tool.pytest.ini_options]
# Put the repo root on sys.path so tests can import the test-support package
# `tests.fixtures.*` (defect injectors etc.) regardless of invocation cwd.
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "expensive: real training fits / multiprocess dataloaders. Skipped by default; run with `--run-expensive`.",
]
filterwarnings = [
  # Third-party: Lightning's _pytree.py calls torch's deprecated LeafSpec. Not
  # our code; drop the noise until Lightning updates.
  "ignore:.*isinstance\\(treespec, LeafSpec\\).*:FutureWarning",
]
