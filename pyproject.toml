[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "image_classifier_dojo"
version = "0.3.0.dev0"
description = "Image-Classifier-Dojo model training package"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sidney Batchelder", email = "sbatchelder@whoi.edu" }]

# --- Base dependencies ---
# Config validation, inspection, storage / result access, schema handling,
# and non-checkpoint artifact / metadata introspection — no Torch required.
# Lightning .ckpt inspection requires the train extra (see DESIGN-DOC/11-dependencies.md).
dependencies = [
  "pydantic",
  "pydantic-settings",
  "hydra-core",
  "omegaconf",
  "pyarrow",
  "duckdb",
  "amplify-storage-utils @ git+https://github.com/WHOIGit/amplify-storage-utils.git",
  "amplify-db-utils @ git+https://github.com/WHOIGit/amplify-db-utils.git",
  "typer",
  "rich",
  "coolname",
  "humanize",
  "tqdm",
  "imagesize",
]

# --- Optional extras, gated by functional area ---
[project.optional-dependencies]
train = [
  "torch",
  "torchvision",
  "lightning",
  "torchmetrics[visual]",
  "numpy",
  "pandas",
  "pillow",
]
timm = ["timm"]
ssl = ["lightly"]
ifcb = ["ifcbkit @ git+https://github.com/WHOIGit/ifcbkit.git"]
repr_eval = [
  "umap-learn",
  "hdbscan",
  "scikit-learn",
]
# aim: disabled on Python 3.14. aim pins aimrocks==0.5.*, which only ships
# wheels for cp36-cp312 (no 3.13/3.14, no buildable sdist). Use the local
# logger sink on 3.14; re-enable once aimrocks publishes a 3.14 wheel, or run
# under Python <=3.12 if the Aim sink is required.
#aim = ["aim"]
onnx = [
  "onnx",
  "onnxruntime-gpu",
]
all = [
  "image_classifier_dojo[train,timm,ssl,ifcb,repr_eval,onnx]",
]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "pre-commit",
]

[project.scripts]
dojo = "dojo.cli.main:main"

[tool.hatch.metadata]
allow-direct-references = true

[project.urls]
Homepage = "https://github.com/WHOIGit/image_classifier_dojo"


[tool.hatch.build.targets.wheel]
packages = ["src/dojo"]

# Keep sdist lean but include configs and scripts if you want them in source tarballs
[tool.hatch.build.targets.sdist]
include = [
  "pyproject.toml",
  "README.md",
  "src/dojo",
  "configs/",
]
